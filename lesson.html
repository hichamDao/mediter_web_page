<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 1 | Éveil Intérieur™</title>
    <meta name="description" content="Module 1 — Poser le silence. Formation spirituelle en ligne Éveil Intérieur™." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        .hero-section::before { display: none; }
        .hero-section { background: linear-gradient(135deg, rgba(27, 176, 206, 0.03), rgba(27, 176, 206, 0.03)); }
    </style>
    <script defer src="js/api.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <header class="hero-section" style="min-height: auto; padding-top: 1.5rem;">
        <nav class="navbar container">
            <a href="index.html" class="logo">Éveil Intérieur</a>
            <div class="nav-links">
                <a href="member-area.html">Mon espace</a>
                <a href="carnet.html">Mon carnet</a>
                <a href="#" id="logoutBtn">Déconnexion</a>
            </div>
        </nav>
    </header>

    <section class="container section" style="padding-bottom:1rem">
        <div class="text-center">
            <span class="module-number" id="moduleNumber">1</span>
            <p class="eyebrow-label" id="moduleKicker"></p>
            <h1 id="moduleTitle"></h1>
            <p class="subtext" id="moduleSubtitle"></p>
        </div>
        <div class="module-nav" id="moduleNav"></div>
    </section>

    <section class="container section" style="padding-top:0">
        <div class="lesson-tabs" id="lessonTabs"></div>
        <article class="lesson-article" id="lessonArticle"></article>
        <div class="lesson-pager" id="lessonPager"></div>
    </section>

    <section class="bg-gray-full section-divider" id="coachingPreview" hidden>
        <div class="container text-center">
            <div class="coaching-card">
                <h2 id="cpTitle"></h2>
                <p class="subtext" id="cpSub"></p>
                <a href="#" class="btn btn-primary" id="cpLink">Commencer la séance</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <a href="index.html" class="logo">Éveil Intérieur</a>
                    <p class="subtext">Votre accompagnement bien-être en ligne.</p>
                </div>
                <div class="footer-links">
                    <a href="index.html">Accueil</a>
                    <a href="member-area.html">Espace membre</a>
                </div>
            </div>
            <div class="footer-bottom"><p>&copy; 2026 Éveil Intérieur. Tous droits réservés.</p></div>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const $ = id => document.getElementById(id);
        let st; try { st = await Api.me(true); } catch { st = null; }
        if (!st || !st.loggedIn) { location.href = 'login.html'; return; }
        const week = st.paid ? st.currentWeek : 0;
        $('logoutBtn').addEventListener('click', e => { e.preventDefault(); Api.logout(); });
        const q = new URLSearchParams(location.search);
        const coachN = parseInt(q.get('c'));
        const isCoach = coachN >= 1 && coachN <= 3;
        const modId = Math.min(Math.max(parseInt(q.get('m')) || 1, 1), 6);
        const kindLabel = { enseignement: 'Enseignement', pratique: 'Pratique de la semaine', meditation: 'Méditation guidée', coaching: 'Séance' };

        // Accès verrouillé -> retour à l'espace membre
        if ((isCoach && week < COACHING_WEEKS[coachN - 1]) || (!isCoach && modId > week)) { location.href = 'member-area.html'; return; }

        // Navigation Modules + Coaching
        $('moduleNav').innerHTML =
            MODULES.map(m => chip(`lesson.html?m=${m.id}`, `Module ${m.id}`, m.id <= week, !isCoach && m.id === modId)).join('') +
            COACHING_INFO.map((c, i) => chip(c.href, `Coaching ${c.id}`, week >= COACHING_WEEKS[i], isCoach && c.id === coachN)).join('');
        function chip(href, label, ok, on) {
            return ok ? `<a href="${href}" class="btn btn-outline btn-small ${on ? 'is-on' : ''}">${label}</a>`
                      : `<span class="btn btn-outline btn-small is-locked" title="Pas encore débloqué">🔒 ${label}</span>`;
        }

        if (isCoach) {
            const info = COACHING_INFO[coachN - 1];
            let s; try { s = (await Api.get('lesson.php?c=' + coachN)).lessons[0]; } catch { location.href = 'member-area.html'; return; }
            document.title = `Coaching ${coachN} | Éveil Intérieur`;
            $('moduleNumber').textContent = coachN;
            $('moduleKicker').textContent = `Séance de coaching · semaine ${COACHING_WEEKS[coachN - 1]}`;
            $('moduleTitle').textContent = info.title;
            $('moduleSubtitle').textContent = info.subtitle;
            $('lessonArticle').innerHTML = `<h2>${s.title}</h2>${s.html}`;
            const next = COACHING_INFO[coachN];
            $('lessonPager').innerHTML = `<a class="btn btn-outline" href="member-area.html">← Mon espace</a>` +
                (next && week >= COACHING_WEEKS[coachN] ? `<a class="btn btn-primary" href="${next.href}">Séance suivante →</a>` : '');
            return;
        }

        const md = MODULES[modId - 1];
        let lessons; try { lessons = (await Api.get('lesson.php?m=' + modId)).lessons; } catch { location.href = 'member-area.html'; return; }
        let li = Math.min(Math.max(parseInt(q.get('l')) || 0, 0), lessons.length - 1);
        document.title = `Module ${modId} | Éveil Intérieur`;
        $('moduleNumber').textContent = modId;
        $('moduleKicker').textContent = `Semaine ${modId}`;
        $('moduleTitle').textContent = md.title;
        $('moduleSubtitle').textContent = md.subtitle;

        function show(i) {
            li = i; const l = lessons[i];
            $('lessonTabs').innerHTML = lessons.map((x, k) =>
                `<button class="lesson-tab ${k === i ? 'on' : ''}" data-i="${k}"><b>${k + 1}</b> ${kindLabel[x.kind]}</button>`).join('');
            $('lessonArticle').innerHTML = `<h2>${l.title}</h2>${l.html}`;
            const last = i === lessons.length - 1;
            const nextMod = modId < 6 && modId + 1 <= week ? `lesson.html?m=${modId + 1}` : 'member-area.html';
            $('lessonPager').innerHTML =
                (i > 0 ? `<button class="btn btn-outline" data-i="${i - 1}">← Précédent</button>` : '<span></span>') +
                (!last ? `<button class="btn btn-primary" data-i="${i + 1}">Suivant : ${kindLabel[lessons[i + 1].kind]} →</button>`
                       : `<a class="btn btn-primary" href="${nextMod}">${nextMod === 'member-area.html' ? 'Terminer, retour à mon espace' : 'Module suivant →'}</a>`);
            history.replaceState(null, '', `lesson.html?m=${modId}&l=${i}`);
            window.scrollTo({ top: $('lessonTabs').offsetTop - 20, behavior: 'smooth' });
        }
        document.body.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) show(+b.dataset.i); });
        show(li);
        window.scrollTo(0, 0);

        // Séance de coaching liée à ce module (semaines 2, 4, 6)
        const ci = COACHING_WEEKS.indexOf(modId);
        if (ci !== -1) {
            $('coachingPreview').hidden = false;
            $('cpTitle').textContent = `Séance de coaching ${ci + 1}`;
            $('cpSub').textContent = COACHING_INFO[ci].title;
            $('cpLink').href = COACHING_INFO[ci].href;
        }
    });
    </script>
</body>
</html>
